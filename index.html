<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/deployment-config.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f1" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("financial-passport-theme");
        } catch {}
        const theme = saved === "light" || saved === "dark" ? saved : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0e1116" : "#f3f3f1";
      })();
    </script>
    <meta
      name="description"
      content="MoveWire — cross-border student finance, made clear."
    />
    <link
      rel="preload"
      href="/fonts/Manrope-Variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>MoveWire</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
